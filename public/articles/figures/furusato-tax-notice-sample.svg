<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif">
  <rect width="600" height="760" rx="18" fill="#f6f7fb"/>
  <!-- 通知書 -->
  <rect x="24" y="24" width="552" height="440" rx="12" fill="#fff" stroke="#1e1b4b" stroke-width="3"/>
  <text x="44" y="64" font-size="22" font-weight="700" fill="#1e1b4b">特別徴収税額の決定通知書（イメージ）</text>
  <rect x="44" y="84" width="220" height="14" rx="4" fill="#e5e7f0"/>
  <text x="44" y="138" font-size="20" font-weight="700" fill="#1e1b4b">税額</text>
  <rect x="44" y="150" width="512" height="220" rx="8" fill="none" stroke="#1e1b4b" stroke-width="2"/>
  <line x1="190" y1="150" x2="190" y2="370" stroke="#1e1b4b" stroke-width="1.5"/>
  <line x1="373" y1="150" x2="373" y2="370" stroke="#1e1b4b" stroke-width="1.5"/>
  <line x1="44" y1="196" x2="556" y2="196" stroke="#1e1b4b" stroke-width="1.5"/>
  <text x="281" y="181" font-size="19" text-anchor="middle" fill="#1e1b4b">市町村民税</text>
  <text x="464" y="181" font-size="19" text-anchor="middle" fill="#1e1b4b">道府県民税</text>
  <rect x="46" y="200" width="508" height="56" fill="#e0e7ff"/>
  <rect x="46" y="200" width="508" height="56" fill="none" stroke="#4f46e5" stroke-width="4"/>
  <text x="58" y="236" font-size="20" font-weight="700" fill="#4f46e5">所得割額</text>
  <text x="358" y="237" font-size="22" font-weight="700" text-anchor="end" fill="#1e1b4b">120,000</text>
  <text x="541" y="237" font-size="22" font-weight="700" text-anchor="end" fill="#1e1b4b">80,000</text>
  <line x1="44" y1="260" x2="556" y2="260" stroke="#1e1b4b" stroke-width="1"/>
  <text x="58" y="321" font-size="17" fill="#6b7280">ほかの税額</text>
  <rect x="290" y="290" width="68" height="16" rx="4" fill="#e5e7f0"/>
  <rect x="473" y="290" width="68" height="16" rx="4" fill="#e5e7f0"/>
  <rect x="290" y="330" width="68" height="16" rx="4" fill="#e5e7f0"/>
  <rect x="473" y="330" width="68" height="16" rx="4" fill="#e5e7f0"/>
  <text x="44" y="414" font-size="20" font-weight="700" fill="#1e1b4b">摘要</text>
  <rect x="100" y="390" width="456" height="50" rx="6" fill="#fff" stroke="#9b2c3a" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="116" y="422" font-size="17" fill="#9b2c3a">控除した額が書かれることがある</text>
  <!-- 矢印 -->
  <path d="M300 472 L300 512" stroke="#4f46e5" stroke-width="5"/>
  <path d="M286 500 L300 516 L314 500" fill="none" stroke="#4f46e5" stroke-width="5" stroke-linejoin="round"/>
  <!-- 足し算 -->
  <rect x="24" y="526" width="552" height="196" rx="14" fill="#fff" stroke="#4f46e5" stroke-width="3"/>
  <text x="300" y="564" font-size="20" text-anchor="middle" fill="#1e1b4b">2つを足す：120,000 ＋ 80,000 ＝</text>
  <text x="300" y="612" font-size="34" font-weight="700" text-anchor="middle" fill="#4f46e5">200,000円</text>
  <text x="300" y="652" font-size="18" text-anchor="middle" fill="#1e1b4b">これを計算ツールに入れる。所得税の税率10%なら</text>
  <text x="300" y="694" font-size="24" font-weight="700" text-anchor="middle" fill="#9b2c3a">上限の目安は52,131円</text>
  <text x="24" y="748" font-size="15" fill="#6b7280">※欄の名前や並びは市区町村によって違います。数字は例です。</text>
</svg>

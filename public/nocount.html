<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>この端末を数えない | ツールひろば</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{color-scheme:light;--bg:#f6f7fb;--panel:#ffffff;--ink:#0f172a;--muted:#5b6477;--line:#e3e6ef;--accent:#4f46e5;--on-accent:#ffffff;--ok:#15803d}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0a0c13;--panel:#12151f;--ink:#e8eaf2;--muted:#9aa1b5;--line:#232838;--accent:#8b8cff;--on-accent:#0a0c13;--ok:#4ade80}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;line-height:1.8;font-size:15px}
main{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:48px 64px}
h1{font-size:22px;margin:0 0 8px}
p{margin:0 0 12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:12px;margin-top:20px}
.state{font-weight:700;font-size:17px}
.state.on{color:var(--ok)}
button{font:inherit;font-weight:700;padding:12px 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
button.sub{background:transparent;color:var(--accent)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.meta{color:var(--muted);font-size:13px}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>この端末を数えない</h1>
  <p>運営者用のページです。ボタンを押すと、このブラウザで見たページはアクセス解析（Cloudflare Web Analytics）に数えられなくなります。</p>
  <div class="box">
    <div class="state" id="state">確認中…</div>
    <button id="on">この端末を数えない</button>
    <button id="off" class="sub">数える状態に戻す</button>
  </div>
  <p class="meta" style="margin-top:16px">ブラウザごとの設定です（PCのChromeとスマホのSafariなど、使うブラウザでそれぞれ押してください）。ブラウザのデータを消すと元に戻ります。</p>
  <p class="meta"><a href="/">トップへ戻る</a></p>
</main>
<script>
(() => {
  const KEY = "no_count";
  const get = () => { try { return localStorage.getItem(KEY) === "1"; } catch (e) { return null; } };
  const set = v => { try { v ? localStorage.setItem(KEY, "1") : localStorage.removeItem(KEY); } catch (e) {} show(); };
  const show = () => {
    const v = get(), el = document.getElementById("state");
    el.className = "state" + (v ? " on" : "");
    el.textContent = v === null ? "このブラウザでは設定を保存できません（プライベートモードなど）" : v ? "✓ この端末は数えていません" : "この端末も数えています";
  };
  document.getElementById("on").addEventListener("click", () => set(true));
  document.getElementById("off").addEventListener("click", () => set(false));
  show();
})();
</script>
</body>
</html>
